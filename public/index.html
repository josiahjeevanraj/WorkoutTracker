<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale=1 stops iOS Safari auto-zooming into inputs under 16px on focus
         (iOS still allows pinch-zoom) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" />
    <title>Workout Tracker</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background: #0E0E0E; /* app background: no white flash while the bundle loads */
      }
      /* Start screen shown until the app first renders (App.js removes it) */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0E0E0E;
      }
      #splash span {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(255, 230, 0, 0.25); border-top-color: #FFE600;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="splash"><span></span></div>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
